name: Deploy 🚀

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: CI ✅
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Do it 💪
    needs: ci
    runs-on: ubuntu-latest
    env:
      APP: /var/www/wishlist.ru-coding.nl
    steps:
      - name: Checkout latest code 🚚
        uses: actions/checkout@v7
      - name: Setup Node 🟢
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Restore cache 📀
        uses: actions/cache@v6
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
      - name: Install dependencies ⏳
        run: npm ci
      - name: Build website 👷‍♀️
        run: npm run build
      - name: Prepare migrations 💾
        run: |
          mkdir .next/standalone/migrate
          cp -R prisma prisma.config.ts .next/standalone/migrate/
          cd .next/standalone/migrate
          echo '{ "private": true, "type": "module", "allowScripts": { "@prisma/engines": true, "prisma": true } }' > package.json
          npm install --no-audit --no-fund \
            prisma@$(node -p "require('../../../node_modules/prisma/package.json').version") \
            dotenv@$(node -p "require('../../../node_modules/dotenv/package.json').version")
      # Copy the contents (/.): the build already creates these folders when it
      # traces a file in them, and copying the folder itself then nests it.
      - name: Copy public folder 🚝
        run: |
          mkdir -p .next/standalone/public
          cp -R public/. .next/standalone/public/
      - name: Copy static folder 🗂
        run: |
          mkdir -p .next/standalone/.next/static
          cp -R .next/static/. .next/standalone/.next/static/
      - name: Check the copied folders 🔎
        run: |
          test -f .next/standalone/public/manifest.json
          test -f .next/standalone/public/theme/sinterklaas.webp
          test ! -e .next/standalone/public/public
          test ! -e .next/standalone/.next/static/static
      - name: Copy pm2 config ⚙️
        run: cp ecosystem.config.cjs .next/standalone/
      - name: Install SSH Key 🔑
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: "just-a-placeholder-so-we-dont-get-errors"
      - name: Adding Known Hosts 💾
        run: ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
      - name: Check database url 🧭
        run: ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "grep -Eq '^DATABASE_URL=\"?file:/' $APP/.env.local" || (echo "DATABASE_URL in .env.local must be an absolute file path" && exit 1)
      # Every deploy gets its own folder, so the running app never sees its
      # files change. Files that didn't change are hard links to the current
      # release. The database, .env.local and avatars stay outside releases.
      - name: Name the release 🏷️
        run: echo "RELEASE=$APP/releases/$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Deploy with rsync 💨
        run: rsync -avz --delete --link-dest=$APP/current/ .next/standalone/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:$RELEASE/
      - name: Link shared files 🔗
        run: ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "ln -s $APP/.env.local $RELEASE/.env.local && ln -s $APP/public/avatars $RELEASE/public/avatars"
      - name: Migrate database 🪤
        run: ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "cd $RELEASE/migrate && dotenv -e ../.env.local npx prisma migrate deploy"
      # pm2 runs in cluster mode (ecosystem.config.cjs): reload starts the new
      # release and stops the old process once the new one listens.
      - name: Switch to the new release 🏁
        run: ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "ln -sfn $RELEASE $APP/current.new && mv -Tf $APP/current.new $APP/current && pm2 reload wishlist"
      - name: Remove old releases 🧹
        run: ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "cd $APP/releases && ls -1 | head -n -3 | xargs -r rm -rf"
