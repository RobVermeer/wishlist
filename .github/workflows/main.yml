name: Deploy 🚀

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: CI ✅
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Do it 💪
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest code 🚚
        uses: actions/checkout@v7
      - name: Setup Node 🟢
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Restore cache 📀
        uses: actions/cache@v6
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
      - name: Install dependencies ⏳
        run: npm ci
      - name: Build website 👷‍♀️
        run: npm run build
      - name: Prepare migrations 💾
        run: |
          mkdir .next/standalone/migrate
          cp -R prisma prisma.config.ts .next/standalone/migrate/
          cd .next/standalone/migrate
          echo '{ "private": true, "type": "module", "allowScripts": { "@prisma/engines": true, "prisma": true } }' > package.json
          npm install --no-audit --no-fund \
            prisma@$(node -p "require('../../../node_modules/prisma/package.json').version") \
            dotenv@$(node -p "require('../../../node_modules/dotenv/package.json').version")
      # Copy the contents (/.): the build already creates these folders when it
      # traces a file in them, and copying the folder itself then nests it.
      - name: Copy public folder 🚝
        run: |
          mkdir -p .next/standalone/public
          cp -R public/. .next/standalone/public/
      - name: Copy static folder 🗂
        run: |
          mkdir -p .next/standalone/.next/static
          cp -R .next/static/. .next/standalone/.next/static/
      - name: Check the copied folders 🔎
        run: |
          test -f .next/standalone/public/manifest.json
          test -f .next/standalone/public/theme/sinterklaas.webp
          test ! -e .next/standalone/public/public
          test ! -e .next/standalone/.next/static/static
      - name: Install SSH Key 🔑
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: "just-a-placeholder-so-we-dont-get-errors"
      - name: Adding Known Hosts 💾
        run: ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
      - name: Check database url 🧭
        run: ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "grep -Eq '^DATABASE_URL=\"?file:/' /var/www/wishlist.ru-coding.nl/.env.local" || (echo "DATABASE_URL in .env.local must be an absolute file path" && exit 1)
      - name: Deploy with rsync 💨
        run: rsync -avz --delete .next/standalone/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/wishlist.ru-coding.nl/ --exclude=.env.local --exclude=database/ --exclude=public/avatars/
      - name: Migrate database 🪤
        run: ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "cd /var/www/wishlist.ru-coding.nl/migrate && dotenv -e ../.env.local npx prisma migrate deploy"
      - name: Restart server 🏁
        run: ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "cd /var/www/wishlist.ru-coding.nl/ && pm2 reload wishlist"
